<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="circuitTitle">
  <title id="circuitTitle">BJT Common-Emitter amplifier schematic</title>

  <defs>
    <style>
      .wire { stroke: #17344b; stroke-width: 2; fill: none; }
      .part { stroke: #17344b; stroke-width: 2; fill: #ffffff; }
      .plate { stroke: #6b7c88; stroke-width: 2; fill: none; }
      .label { font-family: sans-serif; font-size: 13px; fill: #17344b; }
      .small { font-family: sans-serif; font-size: 11px; fill: #6b7c88; }
      .node { fill: #17344b; }
    </style>
  </defs>

  <!-- Power rails -->
  <line class="wire" x1="30" y1="30" x2="490" y2="30"/>
  <line class="wire" x1="30" y1="270" x2="490" y2="270"/>
  <text class="label" x="440" y="24">+VCC</text>
  <text class="label" x="440" y="263">GND</text>

  <!-- Ground symbol -->
  <line class="wire" x1="485" y1="270" x2="485" y2="280"/>
  <line class="wire" x1="475" y1="280" x2="495" y2="280"/>
  <line class="wire" x1="478" y1="285" x2="492" y2="285"/>
  <line class="wire" x1="481" y1="290" x2="489" y2="290"/>

  <!-- Vin source -->
  <line class="wire" x1="30" y1="150" x2="30" y2="192"/>
  <circle class="part" cx="30" cy="210" r="18"/>
  <path class="wire" d="M20 210 Q25 200 30 210 T40 210"/>
  <line class="wire" x1="30" y1="228" x2="30" y2="270"/>
  <text class="label" x="8" y="246">Vin</text>

  <!-- Cin -->
  <line class="wire" x1="30" y1="150" x2="60" y2="150"/>
  <line class="plate" x1="60" y1="138" x2="60" y2="162"/>
  <line class="plate" x1="68" y1="138" x2="68" y2="162"/>
  <line class="wire" x1="68" y1="150" x2="100" y2="150"/>
  <text class="small" x="44" y="134">Cin</text>

  <!-- R1: VCC to base node -->
  <line class="wire" x1="100" y1="30" x2="100" y2="62"/>
  <rect class="part" x="93" y="62" width="14" height="36"/>
  <line class="wire" x1="100" y1="98" x2="100" y2="150"/>
  <text class="label" x="70" y="84">R1</text>

  <!-- R2: base node to GND -->
  <line class="wire" x1="100" y1="150" x2="100" y2="184"/>
  <rect class="part" x="93" y="184" width="14" height="36"/>
  <line class="wire" x1="100" y1="220" x2="100" y2="270"/>
  <text class="label" x="70" y="206">R2</text>

  <!-- Base wire to Q1 -->
  <line class="wire" x1="100" y1="150" x2="244" y2="150"/>
  <text class="small" x="184" y="142">Base</text>
  <circle class="node" cx="100" cy="150" r="3"/>

  <!-- RC: VCC to collector node -->
  <line class="wire" x1="300" y1="30" x2="300" y2="60"/>
  <rect class="part" x="293" y="60" width="14" height="36"/>
  <line class="wire" x1="300" y1="96" x2="300" y2="122"/>
  <text class="label" x="272" y="82">RC</text>

  <!-- NPN transistor Q1 -->
  <circle class="part" cx="250" cy="150" r="24"/>
  <line class="wire" x1="244" y1="136" x2="244" y2="164"/>
  <line class="wire" x1="244" y1="150" x2="226" y2="150"/>
  <line class="wire" x1="244" y1="140" x2="270" y2="122"/>
  <line class="wire" x1="270" y1="122" x2="300" y2="122"/>
  <line class="wire" x1="244" y1="160" x2="270" y2="178"/>
  <polygon points="274,181 264,178 268,170" fill="#17344b"/>
  <text class="label" x="204" y="182">Q1</text>
  <text class="small" x="272" y="140">Collector</text>
  <text class="small" x="282" y="196">Emitter</text>
  <circle class="node" cx="300" cy="122" r="3"/>

  <!-- RE: emitter to GND -->
  <line class="wire" x1="270" y1="178" x2="270" y2="210"/>
  <rect class="part" x="263" y="210" width="14" height="36"/>
  <line class="wire" x1="270" y1="246" x2="270" y2="270"/>
  <text class="label" x="238" y="232">RE</text>

  <!-- Cout + RL output -->
  <line class="wire" x1="300" y1="122" x2="340" y2="122"/>
  <line class="plate" x1="340" y1="110" x2="340" y2="134"/>
  <line class="plate" x1="348" y1="110" x2="348" y2="134"/>
  <line class="wire" x1="348" y1="122" x2="420" y2="122"/>
  <text class="small" x="352" y="142">Cout</text>
  <circle class="node" cx="420" cy="122" r="3"/>
  <text class="label" x="398" y="112">Vout</text>

  <line class="wire" x1="420" y1="122" x2="420" y2="150"/>
  <rect class="part" x="413" y="150" width="14" height="36"/>
  <line class="wire" x1="420" y1="186" x2="420" y2="270"/>
  <text class="label" x="438" y="172">RL</text>
</svg>
