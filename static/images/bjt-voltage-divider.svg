<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="circuitTitle">
  <title id="circuitTitle">BJT Voltage Divider Bias Circuit</title>

  <!-- Power rails -->
  <line x1="60" y1="50" x2="460" y2="50" stroke="#17344b" stroke-width="2"/>
  <line x1="60" y1="250" x2="460" y2="250" stroke="#17344b" stroke-width="2"/>

  <!-- VCC label -->
  <text x="470" y="48" font-family="sans-serif" font-size="16" fill="#17344b">V<tspan baseline-shift="super" font-size="12">CC</tspan></text>
  <text x="470" y="252" font-family="sans-serif" font-size="16" fill="#17344b">GND</text>

  <!-- R1: VCC to Base -->
  <line x1="60" y1="50" x2="140" y2="50" stroke="#17344b" stroke-width="2"/>
  <text x="100" y="38" font-family="sans-serif" font-size="14" fill="#17344b">R<tspan baseline-shift="super" font-size="10">1</tspan></text>

  <!-- Base vertical up from Q1 -->
  <line x1="260" y1="140" x2="260" y2="100" stroke="#17344b" stroke-width="2"/>

  <!-- R2: Base to GND -->
  <line x1="260" y1="250" x2="260" y2="190" stroke="#17344b" stroke-width="2"/>
  <text x="280" y="262" font-family="sans-serif" font-size="14" fill="#17344b">R<tspan baseline-shift="super" font-size="10">2</tspan></text>

  <!-- RC: VCC to Collector -->
  <line x1="60" y1="50" x2="380" y2="50" stroke="#17344b" stroke-width="2"/>
  <text x="220" y="38" font-family="sans-serif" font-size="14" fill="#17344b">R<tspan baseline-shift="super" font-size="10">C</tspan></text>
  <line x1="380" y1="50" x2="380" y2="140" stroke="#17344b" stroke-width="2"/>

  <!-- RE: Emitter to GND -->
  <line x1="260" y1="190" x2="260" y2="250" stroke="#17344b" stroke-width="2"/>
  <text x="200" y="262" font-family="sans-serif" font-size="14" fill="#17344b">R<tspan baseline-shift="super" font-size="10">E</tspan></text>

  <!-- NPN transistor Q1 -->
  <circle cx="260" cy="140" r="22" fill="#ffffff" stroke="#17344b" stroke-width="2"/>
  <line x1="260" y1="100" x2="260" y2="80" stroke="#17344b" stroke-width="2"/>
  <line x1="260" y1="162" x2="260" y2="190" stroke="#17344b" stroke-width="2"/>
  <line x1="380" y1="140" x2="460" y2="140" stroke="#17344b" stroke-width="2"/>
  <text x="228" y="146" font-family="sans-serif" font-size="16" font-weight="bold" fill="#17344b">Q<tspan baseline-shift="super" font-size="10">1</tspan></text>

  <!-- Labels for terminals -->
  <text x="245" y="88" font-family="sans-serif" font-size="14" fill="#17344b">Base</text>
  <text x="466" y="144" font-family="sans-serif" font-size="14" fill="#17344b">Collector</text>
  <text x="245" y="200" font-family="sans-serif" font-size="14" fill="#17344b">Emitter</text>
</svg>
